<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ระบบเช็คชื่อพนักงาน{% endblock %} | PPE Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-building-check me-2"></i>PPE Attendance System
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active fw-semibold{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>แดชบอร์ด
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'checkin' %}active fw-semibold{% endif %}" href="/checkin">
            <i class="bi bi-person-check me-1"></i>เช็คชื่อ
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'employees' %}active fw-semibold{% endif %}" href="/employees">
            <i class="bi bi-people me-1"></i>พนักงาน
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'ppe_management' %}active fw-semibold{% endif %}" href="/ppe-management">
            <i class="bi bi-shield-check me-1"></i>อุปกรณ์ PPE
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'report' %}active fw-semibold{% endif %}" href="/report">
            <i class="bi bi-bar-chart-line me-1"></i>รายงาน
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-3 border-top small">
  PPE Attendance System &copy; 2024 &mdash; Human Management
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
