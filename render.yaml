# Render.com deployment — auto-deploys from GitHub
# docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: human-management
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
